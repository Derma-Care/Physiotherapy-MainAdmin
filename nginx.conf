server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- React Router: unknown paths fall back to index.html ----
    location / {
        try_files $uri /index.html;
    }
    error_page 404 /index.html;

    # ---- Vite build output: hashed, cache-busted files live in /assets/ ----
    # (confirmed against the actual `build/assets/` output - NOT /static/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached - it's what references the
    # current hashed asset filenames, so a stale cached copy would point
    # users at assets that no longer exist after a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- Compression ----
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;
    gzip_vary on;
}